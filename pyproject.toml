[project]
name = "disclosure-agent"
version = "0.1.0"
description = "Reproducible baseline for the Korean disclosure-agent contest project"
requires-python = ">=3.13.11,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "lxml==6.0.1",
    "python-dotenv==1.1.0",
    "requests==2.34.2",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx==0.28.1",
]
